generic:
- id: tension_mesure_realite
  description: Chaque chapitre doit explicitement opposer un indicateur mesurable (KPI, audit) à une dérive
    invisible (perte de sens, atrophie cognitive).
  severity: bloquant
- id: impact_strategique
  description: Chaque risque identifié doit être relié directement à une perte d'avantage concurrentiel
    ou à une menace sur la pérennité de l'entreprise.
  severity: bloquant
- id: posture_dirigeant
  description: Chaque section doit proposer une réflexion ou une question d'auto-évaluation destinée spécifiquement
    au dirigeant pour le sortir de sa posture de 'superviseur technique'.
  severity: recommande
- id: analyse_ontologique
  description: Le texte doit conceptualiser la différence entre 'remplacement de tâche' et 'reconfiguration
    de posture' humaine.
  severity: recommande
