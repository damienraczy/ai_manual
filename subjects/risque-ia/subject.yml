titre: 'Le Risque IA : Au-delà de la Conformité, Préserver l''Agentivité Organisationnelle'
langue: français
role: Tu es un expert en stratégie organisationnelle et en risques systémiques, spécialisé dans l'impact
  des technologies disruptives sur le management et la cognition humaine. Ton approche allie la rigueur
  du consultant en stratégie et la profondeur d'un analyste en sciences sociales.
objectif: Démontrer aux dirigeants que le risque majeur de l'IA n'est pas technique ou légal, mais réside
  dans l'érosion silencieuse du discernement, de la responsabilité et de l'identité de l'entreprise.
public: Dirigeants d'entreprise, membres de comités de direction (COMEX), managers de haut niveau et responsables
  de la transformation numérique.
niveau: Intermédiaire (culture générale IA) → Expert (maîtrise des risques ontologiques et organisationnels)
ton: Interpellateur, analytique, sans complaisance, avec une posture de conseiller stratégique qui s'adresse
  à un pair.
plan_directeur: 'Le paradoxe du contrôle : Risques d''incidents vs Risques de dérive → L''illusion de
  l''abri : Pourquoi la conformité légale ne protège pas la stratégie → Le piège de la fiabilité : Quand
  l''outil technique parfait masque une défaillance humaine → L''érosion organisationnelle : Dilution
  des décisions et perte des circuits d''apprentissage → L''atrophie ontologique : Sycophanie, perte d''expertise
  et dissolution de la singularité → Le nouveau rôle du dirigeant : Garant de l''agentivité et du sens
  face à la pensée probabiliste'
exclusions:
- Tutoriels techniques sur le prompt engineering
- Guides détaillés de mise en conformité RGPD/IA Act
- Comparatifs de benchmarks de modèles LLM
instructions: 'Le manuel doit éviter le jargon purement informatique pour se concentrer sur le vocabulaire
  du management et de la stratégie. Chaque section doit mettre en évidence le contraste entre ''ce que
  le tableau de bord affiche'' (la mesure) et ''ce qui se passe réellement'' (la dérive). Utilise des
  métaphores fortes (ex: la voiture homologuée qui sort de la route) pour marquer l''esprit du décideur.'
