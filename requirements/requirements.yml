version: 1

# Critères communs à TOUS les sujets et à toutes les sections.
# Chaque sujet ajoute les siens dans subjects/<sujet>/requirements.yml.
# severity: "bloquant" force une réécriture si non rempli ; "recommande" est signalé mais n'empêche pas l'acceptation.
generic:
  - id: definition_claire
    description: "Chaque notion abordée est clairement définie avant d'être illustrée."
    severity: bloquant

  - id: coherence_toc
    description: "Le titre et les sous-sections sont exactement ceux de la section attendue, dans le même ordre (aucune omise, aucune ajoutée), et chaque sous-section traite ce que son titre annonce."
    severity: bloquant

  - id: exemples_concrets
    description: "Chaque notion ou méthode majeure est illustrée par au moins un exemple concret."
    severity: bloquant

  - id: style_langue
    description: "Rédaction claire et pédagogique, dans la langue et au ton fixés par les règles de rédaction ; terminologie cohérente d'un bout à l'autre ; aucun métadiscours (annonce du contenu, mention des consignes, de la mémoire ou des documents fournis)."
    severity: bloquant

  - id: format_markdown
    description: "Markdown propre : titre `##`, synthèse en bloc de citation, titres `###` des sous-sections, listes, tableaux et blocs de code bien formés."
    severity: bloquant

  - id: marqueur_fin
    description: "La section se termine par la ligne exacte « --- Fin de la section [numéro] — Dis « continue » pour la suivante --- » avec le bon numéro, et rien après."
    severity: bloquant

  - id: typographie_lexique
    description: "Typographie et lexique conformes aux règles de rédaction : espaces avant la ponctuation double, guillemets « », pas de tiret cadratin dans le texte, casse française des titres, aucun mot proscrit, aucun calque de l'anglais, aucune formule creuse."
    severity: recommande

  - id: densite
    description: "Chaque paragraphe apporte une information : pas de remplissage, pas de rubrique ajoutée pour la forme, pas de phrase de transition vide."
    severity: recommande

  - id: limites
    description: "Les limites ou conditions d'emploi des méthodes présentées sont indiquées quand elles existent."
    severity: recommande

  - id: tableaux_comparatifs
    description: "Quand la section compare plusieurs approches selon les mêmes critères, un tableau les récapitule."
    severity: recommande

  - id: exemples_honnetes
    description: "Un cas présenté comme réel (étude, entreprise, chiffre, citation) est vérifiable ; un cas inventé est présenté comme illustratif."
    severity: recommande

  - id: pas_de_repetition
    description: "La section ne répète pas une même idée, explication ou exemple à plusieurs endroits."
    severity: recommande
